server {
    listen 80;
    server_name localhost;

    # Nonaktifkan access log agar penulisan file log pada 50 RPS konstan
    # tidak mengacaukan metrik Disk I/O Host selama eksperimen
    access_log off;
    error_log /var/log/nginx/error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Content-Type application/json;
    }

    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }
}
